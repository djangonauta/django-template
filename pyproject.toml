[project]
name = "django-template"
version = "0.1.0"
description = "Template django contendo alguns pacotes úteis"
authors = [
    {name = "djangonauta", email = "igbrch@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "arrow (>=1.4.0,<2.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "crispy-bootstrap5 (>=2026.3,<2027.0)",
    "django (>=6.0.4,<7.0.0)",
    "django-allauth (>=65.15.1,<66.0.0)",
    "django-auditlog (>=3.4.1,<4.0.0)",
    "django-auth-ldap (>=5.3.0,<6.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "django-celery-results (>=2.6.0,<3.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django-crispy-forms (>=2.6,<3.0)",
    "django-csp (>=4.0,<5.0)",
    "django-environ (>=0.13.0,<0.14.0)",
    "django-extensions (>=4.1,<5.0)",
    "django-extra-fields (>=3.0.2,<4.0.0)",
    "django-filter (>=25.2,<26.0)",
    "django-formtools (>=2.5.1,<3.0.0)",
    "django-guardian (>=3.3.1,<4.0.0)",
    "django-hijack (>=3.7.7,<4.0.0)",
    "django-model-utils (>=5.0.0,<6.0.0)",
    "django-post-office (>=3.11.0,<4.0.0)",
    "django-prometheus (>=2.4.1,<3.0.0)",
    "django-redis (>=6.0.0,<7.0.0)",
    "django-rest-auth (>=0.9.5,<0.10.0)",
    "django-select2 (>=8.4.8,<9.0.0)",
    "django-structlog[celery] (>=10.0.0,<11.0.0)",
    "django-view-breadcrumbs (>=2.5.1,<3.0.0)",
    "django-weasyprint (>=2.5.0,<3.0.0)",
    "django-widget-tweaks (>=1.5.1,<2.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "djangorestframework-guardian2 (>=0.7.0,<0.8.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "drf-spectacular-sidecar (>=2026.4.1,<2027.0.0)",
    "gunicorn (>=25.3.0,<26.0.0)",
    "hiredis (>=3.3.1,<4.0.0)",
    "invoke (>=3.0.3,<4.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "psycopg[binary] (>=3.3.3,<4.0.0)",
    "pygraphviz (>=1.14,<2.0)",
    "redis (>=7.4.0,<8.0.0)",
    "setuptools (>=82.0.1,<83.0.0)",
    "weasyprint (>=68.1,<69.0)",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "commitizen (>=4.13.10,<5.0.0)",
    "coverage (>=7.13.5,<8.0.0)",
    "django-debug-toolbar (>=6.3.0,<7.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "ipython (>=9.12.0,<10.0.0)",
    "pyopenssl (>=26.0.0,<27.0.0)",
    "ruff (>=0.15.10,<0.16.0)",
    "selenium (>=4.43.0,<5.0.0)",
    "werkzeug (>=3.1.8,<4.0.0)"
]

[tool.poetry.group.dev]
optional = true

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["migrations", "venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear — pega bugs sutis
    "SIM",  # flake8-simplify — sugere simplificações
    "DJ",   # flake8-django — regras específicas pro Django
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver2"
version_provider = "pep621"
update_changelog_on_bump = true
changelog_incremental = true
major_version_zero = true
annotated_tag = true
bump_message = "chore(release): $current_version → $new_version"
version_files = ["pyproject.toml:project.version"]
pre_bump_hooks = ["ruff check .", "ruff format --check ."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
